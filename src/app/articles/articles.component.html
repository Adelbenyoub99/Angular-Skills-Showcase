<div class="card h-100 shadow-sm border-0 article-card">
  <div class="position-relative">
    <img [src]="urlImg" [alt]="textAltImg || titreArticle" class="card-img-top article-thumb">
    <span class="position-absolute top-0 end-0 m-2 badge" [ngClass]="dispo ? 'bg-success' : 'bg-secondary'">
      {{ dispo ? 'Disponible' : 'Réservé' }}
    </span>
  </div>

  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h5 class="card-title text-truncate mb-0" [title]="titreArticle">
        {{ titreArticle }}
      </h5>
      <span class="badge bg-light text-dark border fs-6 fw-bold">
        {{ prixArticle }} €
      </span>
    </div>

    <p class="card-text text-muted small flex-grow-1 line-clamp-3">
      {{ description }}
    </p>

    <div class="d-flex align-items-center justify-content-between border-top pt-3 mt-2">
      <a class="btn btn-outline-primary btn-sm" [routerLink]="['/detail', idArticle]">
        Consulter &rarr;
      </a>

      <button
        type="button"
        class="btn btn-sm"
        [ngClass]="jaime ? 'btn-danger' : 'btn-outline-secondary'"
        (click)="onLike()">
        <span>{{ jaime ? '❤️ Aimé' : '🤍 J\'aime' }}</span>
        <span class="badge bg-white text-dark ms-1" *ngIf="totalNbrLike > 0">{{ totalNbrLike }}</span>
      </button>
    </div>
  </div>
</div>
